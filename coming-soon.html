<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emily McBurney</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #000000 0%, #1a0030 20%, #3d0d6e 50%, #7b1fa2 75%, #c2185b 100%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo {
      position: fixed;
      top: 50px;
      left: 8.8em;
      text-decoration: none;
      color: #fff;
      line-height: 0;
      display: block;
      width: 70px;
      padding: 11px 10px 10px;
      border-radius: 90px;
      overflow: visible;
    }
    .logo svg {
      width: 50px;
      height: 50px;
      display: block;
    }

    .back-link {
      position: fixed;
      top: 2.1rem;
      right: 2.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }

    .content {
      text-align: center;
      padding: 2rem;
    }

    .label {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 2rem;
    }

    h1 {
      font-family: 'Italiana', sans-serif;
      font-weight: 400;
      font-size: 180px;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }

    h1 em {
      font-style: italic;
      color: #888;
    }

    .sub {
      margin-top: 2rem;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      color: #555;
    }
  </style>
</head>
<body>
  <a href="index.html" class="logo" aria-label="home">
    <svg viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg" width="40" height="40">
      <path d="M31.0003 2.01C29.4903 1.99 29.8003 1.97 28.3403 2.18" stroke="currentColor" stroke-width="4" stroke-miterlimit="10"></path>
      <path d="M29.4305 2C15.4805 3.96 4.03047 15.07 2.24047 29.72C0.100466 47.2 12.5405 63.1 30.0205 65.23C47.5005 67.36 63.4005 54.92 65.5405 37.44C66.5105 29.47 64.4505 21.82 60.2705 15.66L51.3605 28.1L39.5005 9.75V54" stroke="currentColor" stroke-width="4" stroke-miterlimit="10"></path>
      <path d="M1.99023 33.58H27.6702" stroke="currentColor" stroke-width="4" stroke-miterlimit="10"></path>
    </svg>
  </a>

  <div class="content">
    <h1>Projects<br>coming soon</h1>
  </div>
</body>
</html>
