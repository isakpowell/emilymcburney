<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emily McBurney</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translate3d(0, 60px, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes scrollLine {
      0%   { transform: translateY(0%);   opacity: 1; }
      60%  { transform: translateY(100%); opacity: 0; }
      61%  { transform: translateY(-100%); opacity: 0; }
      100% { transform: translateY(0%);   opacity: 1; }
    }

    body {
      background: linear-gradient(135deg, #000000, #1a0030, #3d0d6e, #7b1fa2, #c2185b, #1a0030, #000000);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo {
      position: fixed;
      top: clamp(1rem, 4vw, 50px);
      left: clamp(1.5rem, 8.8em, 10vw);
      text-decoration: none;
      color: #fff;
      line-height: 0;
      display: block;
      width: 70px;
      padding: 11px 10px 10px;
      border-radius: 90px;
      overflow: visible;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.2s forwards;
    }
    .logo svg {
      width: 50px;
      height: 50px;
      display: block;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6em;
      margin-top: 3rem;
      padding: 0.75em 1.75em;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 100px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      backdrop-filter: blur(8px);
      background: rgba(255,255,255,0.08);
      transition: background 0.25s, border-color 0.25s;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.85s forwards;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.7);
    }
    .back-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .content {
      text-align: center;
      padding: 2rem;
    }

    /* Clip each line so it slides up into view */
    .line-wrap {
      overflow: hidden;
      display: block;
      padding-bottom: 0.15em;
      margin-bottom: -0.15em;
    }

    h1 {
      font-family: 'Italiana', sans-serif;
      font-weight: 400;
      font-size: clamp(3rem, 15vw, 180px);
      line-height: 1.05;
      letter-spacing: -0.01em;
    }

    h1 .l1 {
      display: block;
      opacity: 0;
      transform: translate3d(0, 100%, 0);
      animation: fadeSlideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }
    h1 .l2 {
      display: block;
      opacity: 0;
      transform: translate3d(0, 100%, 0);
      animation: fadeSlideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
    }

    /* Scroll indicator */
    .scroll-indicator {
      position: fixed;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      animation: fadeIn 1s ease 1.2s forwards;
    }
    .scroll-text {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }
    .scroll-line-wrap {
      width: 1px;
      height: 50px;
      background: rgba(255,255,255,0.15);
      overflow: hidden;
      position: relative;
    }
    .scroll-line-inner {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.7);
      animation: scrollLine 2s ease-in-out 1.5s infinite;
    }
  </style>
</head>
<body>
  <a href="index.html" class="logo" aria-label="home">
    <svg viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg" width="40" height="40">
      <path d="M31.0003 2.01C29.4903 1.99 29.8003 1.97 28.3403 2.18" stroke="currentColor" stroke-width="4" stroke-miterlimit="10"></path>
      <path d="M29.4305 2C15.4805 3.96 4.03047 15.07 2.24047 29.72C0.100466 47.2 12.5405 63.1 30.0205 65.23C47.5005 67.36 63.4005 54.92 65.5405 37.44C66.5105 29.47 64.4505 21.82 60.2705 15.66L51.3605 28.1L39.5005 9.75V54" stroke="currentColor" stroke-width="4" stroke-miterlimit="10"></path>
      <path d="M1.99023 33.58H27.6702" stroke="currentColor" stroke-width="4" stroke-miterlimit="10"></path>
    </svg>
  </a>

  <div class="content">
    <h1>
      <span class="line-wrap"><span class="l1">Projects</span></span>
      <span class="line-wrap"><span class="l2">coming soon</span></span>
    </h1>
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 7H2M2 7L6.5 2.5M2 7L6.5 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to portfolio
    </a>
  </div>

  <div class="scroll-indicator">
    <div class="scroll-line-wrap"><div class="scroll-line-inner"></div></div>
  </div>
</body>
</html>
